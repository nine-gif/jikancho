<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6D73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="じかん帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>じかん帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* layout: one-screen phone app — header / scrolling page / 5-tab bar; the day is a 24h ruler, 1.2px per minute */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --fg:#17202B; --muted:#667282; --line:#D8DDE4; --past:#E1E5EA;
  --accent:#0E6D73; --accent-fg:#FFFFFF; --accent-soft:#D6EBEB; --now:#D9432F; --warn:#C0392B;
  --ev:#2F62C9; --ev-bg:#E2EAFA; --todo:#B06C0C; --todo-bg:#FAEED7; --habit:#23845A; --habit-bg:#DCF0E5; --free:#8C98A8;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-num:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 10px 30px rgba(18,28,40,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#192029; --surface-2:#202833; --fg:#E6EBF1; --muted:#97A2B0; --line:#2B3440; --past:#151A21;
  --accent:#4DB4B9; --accent-fg:#0B1A1B; --accent-soft:#1B3436; --now:#FF6A55; --warn:#FF7B6B;
  --ev:#86A9F3; --ev-bg:#1E2A43; --todo:#E6AA52; --todo-bg:#3A2C16; --habit:#5FC796; --habit-bg:#173226; --free:#6E7B8C;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#192029; --surface-2:#202833; --fg:#E6EBF1; --muted:#97A2B0; --line:#2B3440; --past:#151A21;
  --accent:#4DB4B9; --accent-fg:#0B1A1B; --accent-soft:#1B3436; --now:#FF6A55; --warn:#FF7B6B;
  --ev:#86A9F3; --ev-bg:#1E2A43; --todo:#E6AA52; --todo-bg:#3A2C16; --habit:#5FC796; --habit-bg:#173226; --free:#6E7B8C;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
header.top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 0;position:relative;z-index:3}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.datebtn{display:flex;align-items:baseline;gap:2px;text-align:left;min-width:0}
.datebtn .dm{font-size:26px;font-weight:700;letter-spacing:.01em}
.datebtn .wd{font-size:17px;font-weight:500;color:var(--muted)}
.badge{margin-left:8px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent-fg);background:var(--accent);border-radius:99px;padding:2px 8px;align-self:center}
.ptitle{font-size:22px;font-weight:700}
.hact{display:flex;align-items:center;gap:8px}
.ghost{font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--fg)}
.plus{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;padding-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 12px}
.sub b{color:var(--fg);font-weight:500}
.grip{display:block;width:100%;height:16px;position:relative}
.grip::after{content:"";position:absolute;left:50%;top:5px;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:var(--line)}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 0 10px}
.ws{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:10px;position:relative;gap:1px}
.ws span{font-size:11px;color:var(--muted)}
.ws b{font-family:var(--f-num);font-size:16px;font-weight:500}
.ws i{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:3px}
.ws.td b{color:var(--accent)}
.ws.sel{background:var(--accent)}
.ws.sel span,.ws.sel b{color:var(--accent-fg)}
.ws.sel i{background:var(--accent-fg)}

main#main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain}
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;color:var(--muted);font-size:10.5px;font-weight:500}
.tab.on{color:var(--accent)}

/* timeline */
.untimed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px 4px}
.untimed .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:99px;padding:3px 10px 3px 4px;max-width:100%}
.chip.event{background:var(--ev-bg)} .chip.todo{background:var(--todo-bg)}
.chip .dot{width:8px;height:8px;border-radius:50%;margin-left:6px}
.chip.event .dot{background:var(--ev)}
.chip .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.done .ti{text-decoration:line-through;color:var(--muted)}
.tl{position:relative;margin:12px 0 28px}
/* week view */
.wk{position:relative;margin:10px 0 24px}
.wk .hr{left:40px}
.wk .hr span{left:-38px;width:32px;font-size:11px}
.wcol{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);cursor:pointer}
.wcol.sel{background:var(--accent-soft)}
.wcol .wpast{position:absolute;left:0;right:0;top:0;background:var(--past);opacity:.8}
.wb{position:absolute;border-radius:7px;padding:2px 3px;font-size:10.5px;line-height:1.25;overflow:hidden;word-break:break-all;cursor:pointer;z-index:1;border:1px solid}
.wb.event{background:var(--ev-bg);border-color:var(--ev)}
.wb.todo{background:var(--todo-bg);border-color:var(--todo)}
.wb.habit{background:var(--habit-bg);border-color:var(--habit);border-radius:99px;text-align:center}
.wb.done{opacity:.55;text-decoration:line-through}
.wnow{position:absolute;height:2px;background:var(--now);z-index:2;pointer-events:none}
.dayp{flex:none;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 18px rgba(18,28,40,.08);max-height:34%;overflow-y:auto;padding:10px 16px 12px;display:flex;flex-direction:column;gap:6px}
.dp-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dp-h b{font-size:15px}
.dp-h button{font-size:13px;font-weight:500;color:var(--accent)}
.dp-r{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:3px 0}
.dp-r .tm{font:12px var(--f-num);color:var(--muted);width:40px;flex:none}
.dp-r .bar{width:3px;height:18px;border-radius:2px;flex:none}
.dp-r .bar.event{background:var(--ev)} .dp-r .bar.todo{background:var(--todo)} .dp-r .bar.habit{background:var(--habit)}
.dp-r .ti{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-r.done .ti{text-decoration:line-through;color:var(--muted)}
.tl.anim-l{animation:inL .22s ease-out}.tl.anim-r{animation:inR .22s ease-out}
@keyframes inL{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.past{position:absolute;left:0;right:0;top:0;background:var(--past)}
.off{position:absolute;left:52px;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);opacity:.45}
.hr{position:absolute;left:52px;right:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:-46px;top:-9px;width:38px;text-align:right;font:12px/1 var(--f-num);color:var(--muted)}
.nowline{position:absolute;left:52px;right:0;height:2px;background:var(--now);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.nowline span{position:absolute;left:-50px;top:-9px;font:500 11px/1 var(--f-num);color:#fff;background:var(--now);border-radius:4px;padding:3px 4px}
.blk{position:absolute;border-radius:8px;border-left:3px solid;padding:4px 8px;overflow:hidden;display:flex;gap:6px;align-items:flex-start;cursor:pointer;z-index:1}
.blk.event{background:var(--ev-bg);border-color:var(--ev)}
.blk.todo{background:var(--todo-bg);border-color:var(--todo)}
.blk.habit{background:var(--habit-bg);border-color:var(--habit)}
.blk .bt{min-width:0}
.blk .ti{font-size:13.5px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .tm{font:11px/1.3 var(--f-num);color:var(--muted)}
.blk.sm{align-items:center;padding-block:1px}
.blk.sm .bt{display:flex;gap:6px;align-items:baseline}
.blk.done .ti{text-decoration:line-through;color:var(--muted)}
.blk.past-b{opacity:.6}
.ck{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--muted);display:grid;place-items:center;flex:none;cursor:pointer;color:transparent}
.ck svg{width:13px;height:13px;stroke-width:2.6}
.blk.todo .ck,.row .ck{border-color:var(--todo)}
.blk.habit .ck{border-color:var(--habit)}
.ck.on{color:#fff}
.blk.todo .ck.on,.row .ck.on{background:var(--todo);border-color:var(--todo)}
.blk.habit .ck.on{background:var(--habit);border-color:var(--habit)}
.free{position:absolute;left:60px;right:12px;border:1.5px dashed var(--free);border-radius:8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;text-align:center;line-height:1.35}
.free b{font-size:14px;font-weight:700;color:var(--fg)}
.free.sm{flex-direction:row;gap:8px}
.free.sm span{display:none}
.free:hover{background:var(--accent-soft)}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}

/* lists */
.pad{padding:14px 16px 28px;display:flex;flex-direction:column;gap:18px}
.qa{display:flex;gap:8px}
.qa input,.field input,.field select,.field textarea,.set select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.qa button,.btn{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:10px 16px;font-weight:700;flex:none}
.grp{display:flex;flex-direction:column;gap:6px}
.gh{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center}
.gh span{font-family:var(--f-num);font-weight:500}
.gh.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:11px 12px;cursor:pointer}
.row .rt{flex:1;min-width:0}
.row .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .ti{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.slot-btn{font-size:12px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:4px 10px;flex:none;white-space:nowrap}
.linkbtn{color:var(--accent);font-size:13px;font-weight:500;align-self:flex-start}
.empty{background:var(--surface);border-radius:14px;padding:22px 18px;color:var(--muted);font-size:14px;line-height:1.7}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}

/* habits */
.hsum{display:flex;align-items:baseline;gap:10px}
.hsum b{font:500 30px/1 var(--f-num)}
.hsum span{color:var(--muted);font-size:13px}
.hcard{background:var(--surface);border-radius:14px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px}
.hc-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;cursor:pointer}
.hc-top .ti{font-weight:700}
.streak{text-align:right;font-size:11px;color:var(--muted);white-space:nowrap}
.streak b{font:500 20px/1 var(--f-num);color:var(--habit);margin-right:2px}
.hweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.hd i{width:30px;height:30px;border-radius:50%;border:1.8px solid var(--habit);display:grid;place-items:center;color:transparent;font-style:normal}
.hd i svg{width:15px;height:15px;stroke-width:2.6}
.hd.on i{background:var(--habit);color:#fff}
.hd.today span{color:var(--fg);font-weight:700}
.hd:disabled i{border-color:var(--line);border-style:dashed}
.hd.off i{border:0;color:var(--line)}

/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between}
.calh b{font-size:18px}
.calh .nav{display:flex;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-radius:14px;padding:6px;gap:2px}
.cal .wh{font-size:11px;text-align:center;color:var(--muted);padding:4px 0}
.cal .wh.sun{color:var(--warn)} .cal .wh.sat{color:var(--ev)}
.cd{aspect-ratio:1/1.05;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px}
.cd b{font:500 15px/1 var(--f-num)}
.cd.out{opacity:.35}
.cd.td b{color:var(--accent)}
.cd.sel{background:var(--accent)} .cd.sel b{color:var(--accent-fg)}
.cd .dots{display:flex;gap:3px}
.cd .dots i{width:5px;height:5px;border-radius:50%}
.cd .dots .e{background:var(--ev)} .cd .dots .t{background:var(--todo)}
.cd.sel .dots i{background:var(--accent-fg)}
.agenda{display:flex;flex-direction:column;gap:6px}
.ag{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.ag .tm{font:12px var(--f-num);color:var(--muted);width:44px;flex:none}
.ag .bar{width:3px;align-self:stretch;border-radius:2px}
.ag .bar.event{background:var(--ev)} .ag .bar.todo{background:var(--todo)} .ag .bar.habit{background:var(--habit)}
.ag .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* settings */
.set{background:var(--surface);border-radius:14px;display:flex;flex-direction:column}
.set .sr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.set .sr:first-child{border-top:0}
.set .sr .k{font-weight:500}
.set .sr .k small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.set select{width:auto;padding:7px 10px}
.set .two{display:flex;gap:6px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.sh-h b{font-size:17px}
.sh-h button{color:var(--muted);font-size:14px;padding:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:7px 0;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled:not(.on){opacity:.4}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
.field textarea{min-height:64px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wds button{border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:14px}
.wds button.on{background:var(--habit);border-color:var(--habit);color:#fff}
.err{color:var(--warn);font-size:13px;min-height:0}
.sh-f{display:flex;gap:10px;justify-content:space-between;align-items:center}
.del{color:var(--warn);font-size:14px;font-weight:500;padding:8px 4px}
.del.arm{background:var(--warn);color:#fff;border-radius:10px;padding:8px 12px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){.tl.anim-l,.tl.anim-r,.sheet{animation:none}}
</style>
</head>
<body>

<div id="app">
  <header class="top" id="hdr"></header>
  <main id="main"></main>
  <section class="dayp" id="dayp" hidden></section>
  <nav class="tabs" id="nav"></nav>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const PX=1.2;            // 1分あたりのピクセル
const PXW=0.8;           // 週表示の1分あたりのピクセル
const LS='jikancho-v1';
const WD='日月火水木金土';
const ICON={
  tl:'<svg viewBox="0 0 24 24"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h7M10 18h9"/></svg>',
  todo:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  habit:'<svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 0 1 13.2-4.9M19.5 12a7.5 7.5 0 0 1-13.2 4.9"/><path d="M18 3.5v4h-4M6 20.5v-4h4"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>'
};

/* ---------- 日付ユーティリティ ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>`${Math.floor(m/60)}:${pad(m%60)}`;
const fromMin2=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fmtDur=m=>{const h=Math.floor(m/60),r=m%60;return h?(r?`${h}時間${r}分`:`${h}時間`):`${r}分`};
const md=s=>{const d=parseYmd(s);return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

/* ---------- 状態 ---------- */
const S={items:[],habits:[],settings:{wake:6,sleep:23,weekStart:1},
  sel:today(),page:'tl',calMonth:null,loading:true,importData:null,showWeek:false,showDone:false,anim:''};

/* ---------- 保存先：この端末のブラウザ ---------- */
const Store={
  loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v){S.items=v.items||[];S.habits=v.habits||[];Object.assign(S.settings,v.settings||{})}}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS,JSON.stringify({items:S.items,habits:S.habits,settings:S.settings}))}catch(e){toast('保存できませんでした。空き容量を確認してください')}},
  put(){this.saveLocal()},del(){this.saveLocal()},putSettings(){this.saveLocal()}
};
function saveItem(it){const i=S.items.findIndex(x=>x.id===it.id);if(i<0)S.items.push(it);else S.items[i]=it;Store.put('items',it);render()}
function removeItem(id){S.items=S.items.filter(x=>x.id!==id);Store.del('items',id);render()}
function saveHabit(h){const i=S.habits.findIndex(x=>x.id===h.id);if(i<0)S.habits.push(h);else S.habits[i]=h;Store.put('habits',h);render()}
function removeHabit(id){S.habits=S.habits.filter(x=>x.id!==id);Store.del('habits',id);render()}

function init(){
  Store.loadLocal();S.loading=false;render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- 計算 ---------- */
const scheduled=(h,date)=>(h.days||[]).includes(parseYmd(date).getDay())&&!(h.created&&date<h.created);
function blocksFor(date){
  const out=[];
  for(const it of S.items){
    if(it.date!==date||!it.start)continue;
    const s=toMin(it.start);let e=toMin(it.end);
    if(e==null||e<=s)e=s+(it.kind==='todo'?30:60);
    out.push({type:it.kind,s,e:Math.min(e,1440),ref:it,title:it.title,done:!!it.done});
  }
  for(const h of S.habits){
    if(!h.time||!scheduled(h,date))continue;
    const s=toMin(h.time);
    out.push({type:'habit',s,e:Math.min(s+(+h.dur||15),1440),ref:h,title:h.title,done:!!(h.log||{})[date]});
  }
  out.sort((a,b)=>a.s-b.s||b.e-a.e);
  // 重なった予定は横に並べる
  let group=[],gEnd=-1;
  const flush=()=>{const cols=[];group.forEach(b=>{let i=cols.findIndex(end=>end<=b.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=b.e;b.col=i});group.forEach(b=>b.ncol=cols.length);group=[];gEnd=-1};
  for(const b of out){if(group.length&&b.s>=gEnd)flush();group.push(b);gEnd=Math.max(gEnd,b.e)}
  if(group.length)flush();
  return out;
}
function freeSlots(date,bl,minLen=30){
  const td=today();if(date<td)return[];
  const wake=S.settings.wake*60,sleep=S.settings.sleep*60;
  let cur=wake;if(date===td)cur=Math.max(wake,Math.ceil(nowMin()/5)*5);
  const res=[];
  for(const b of bl){
    if(cur>=sleep)break;
    if(b.e<=cur)continue;
    if(b.s>cur){const end=Math.min(b.s,sleep);if(end-cur>=minLen)res.push([cur,end])}
    cur=Math.max(cur,b.e);
  }
  if(sleep-cur>=minLen)res.push([cur,sleep]);
  return res;
}
function weekOf(date){const d=parseYmd(date);const off=(d.getDay()-S.settings.weekStart+7)%7;const st=addDays(date,-off);return[0,1,2,3,4,5,6].map(i=>addDays(st,i))}
function hasAny(date){return S.items.some(i=>i.date===date&&!(i.kind==='todo'&&i.done))}
function streak(h){
  let d=today(),n=0;const log=h.log||{};
  if(!log[d])d=addDays(d,-1);
  for(let i=0;i<500;i++){if(h.created&&d<h.created)break;if(scheduled(h,d)){if(log[d])n++;else break}d=addDays(d,-1)}
  return n;
}
function daysLabel(days){
  const s=[...(days||[])].sort().join('');
  if(s==='0123456')return'毎日';if(s==='12345')return'平日';if(s==='06')return'土日';
  const ord=[1,2,3,4,5,6,0].filter(x=>(days||[]).includes(x));return ord.map(x=>WD[x]).join('・');
}
function daySummary(date){
  const bl=blocksFor(date);
  const ev=S.items.filter(i=>i.date===date&&i.kind==='event').length;
  const tds=S.items.filter(i=>i.date===date&&i.kind==='todo');
  const hs=S.habits.filter(h=>scheduled(h,date));
  const free=freeSlots(date,bl).reduce((a,[s,e])=>a+e-s,0);
  return {ev,td:tds.length,tdDone:tds.filter(t=>t.done).length,hs:hs.length,hsDone:hs.filter(h=>(h.log||{})[date]).length,free};
}

/* ---------- 描画 ---------- */
function render(){renderHeader();renderPage();renderNav()}

function weekHtml(){
  const days=weekOf(S.sel),td=today(),nm=nowMin();
  const colL=i=>`calc(40px + (100% - 44px) * ${i}/7)`,colW='calc((100% - 44px) / 7)';
  let h=`<div class="wk ${S.anim?'anim-'+S.anim:''}" style="height:${1440*PXW}px">`;
  days.forEach((d,i)=>{
    const pastH=d<td?1440:d===td?nm:0;
    h+=`<div class="wcol ${d===S.sel?'sel':''}" data-act="pick" data-date="${d}" style="left:${colL(i)};width:${colW}">${pastH?`<div class="wpast" style="height:${pastH*PXW}px"></div>`:''}</div>`;
  });
  for(let i=0;i<24;i++)h+=`<div class="hr" style="top:${i*60*PXW}px;pointer-events:none"><span>${i}:00</span></div>`;
  days.forEach((d,i)=>{
    for(const b of blocksFor(d)){
      const top=b.s*PXW,ht=Math.max((b.e-b.s)*PXW,16);
      const left=`calc(40px + (100% - 44px) * ${i}/7 + (100% - 44px) / 7 * ${b.col}/${b.ncol} + 1px)`,width=`calc((100% - 44px) / 7 / ${b.ncol} - 2px)`;
      h+=`<div class="wb ${b.type} ${b.done?'done':''}" data-act="${b.type==='habit'?'edit-habit':'edit-item'}" data-id="${b.ref.id}" role="button" tabindex="0" aria-label="${md(d)} ${fromMin(b.s)} ${esc(b.title)}" style="top:${top}px;height:${ht-1}px;left:${left};width:${width}">${esc(b.title)}</div>`;
    }
    if(d===td)h+=`<div class="wnow" style="top:${nm*PXW}px;left:${colL(i)};width:${colW}"></div>`;
  });
  return h+'</div>';
}
function dayPanelHtml(){
  const d=S.sel;
  const list=[...blocksFor(d).map(b=>({tm:fromMin(b.s),type:b.type,title:b.title,id:b.ref.id,done:b.done})),
    ...S.items.filter(i=>i.date===d&&!i.start).map(i=>({tm:'－',type:i.kind,title:i.title,id:i.id,done:i.done}))];
  return `<div class="dp-h"><b>${md(d)}</b><button data-act="open-day" data-date="${d}">この日を開く</button></div>`+
    (list.length?list.map(a=>`<div class="dp-r ${a.done?'done':''}" data-act="${a.type==='habit'?'edit-habit':'edit-item'}" data-id="${a.id}" role="button" tabindex="0"><span class="tm">${a.tm}</span><span class="bar ${a.type}"></span><span class="ti">${esc(a.title)}</span></div>`).join('')
    :'<div class="meta">この日の予定はありません。</div>');
}

function renderNav(){
  const tabs=[['tl','タイムライン'],['todo','ToDo'],['habit','習慣'],['cal','カレンダー'],['set','設定']];
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="tab ${S.page===k?'on':''}" data-act="go" data-p="${k}" aria-current="${S.page===k?'page':'false'}">${ICON[k]}<span>${l}</span></button>`).join('');
}

function renderHeader(){
  const h=$('#hdr');
  if(S.page==='tl'){
    const d=parseYmd(S.sel),isT=S.sel===today(),sm=daySummary(S.sel);
    const parts=[];
    if(S.loading)parts.push('読み込み中…');
    else{
      parts.push(`予定 <b class="num">${sm.ev}</b>`);
      if(sm.td)parts.push(`ToDo <b class="num">${sm.tdDone}/${sm.td}</b>`);
      if(sm.hs)parts.push(`習慣 <b class="num">${sm.hsDone}/${sm.hs}</b>`);
      if(S.sel>=today())parts.push(`空き <b>${sm.free?fmtDur(sm.free):'なし'}</b>`);
    }
    h.innerHTML=`<div class="hrow">
      <button class="datebtn" data-act="open-cal" aria-label="カレンダーを開く"><span class="dm">${d.getMonth()+1}月${d.getDate()}日</span><span class="wd">（${WD[d.getDay()]}）</span>${isT?'<span class="badge">今日</span>':''}</button>
      <div class="hact">${isT?'':'<button class="ghost" data-act="today">今日</button>'}<button class="plus" data-act="add" aria-label="追加">${ICON.plus}</button></div>
    </div>
    <div class="sub"><span class="num">${d.getFullYear()}</span>${parts.map(p=>`<span>${p}</span>`).join('')}</div>
    ${weekStrip()}
    <button class="grip" data-act="toggle-week" aria-label="${S.showWeek?'週の表示を閉じる':'週を表示'}"></button>`;
  }else{
    const t={todo:'ToDo',habit:'習慣',cal:'カレンダー',set:'設定'}[S.page];
    h.innerHTML=`<div class="hrow" style="padding-bottom:10px"><span class="ptitle">${t}</span>${S.page==='set'?'':`<button class="plus" data-act="add" aria-label="追加">${ICON.plus}</button>`}</div>`;
  }
}
function weekStrip(){
  const td=today();
  return `<div class="week-strip">${weekOf(S.sel).map(d=>{const x=parseYmd(d);return `<button class="ws ${d===S.sel?'sel':''} ${d===td?'td':''}" data-act="pick" data-date="${d}"><span>${WD[x.getDay()]}</span><b>${x.getDate()}</b>${hasAny(d)?'<i></i>':''}</button>`}).join('')}</div>`;
}

let lastView='';
function renderPage(){
  const m=$('#main');
  const wk=S.page==='tl'&&S.showWeek;
  const key=wk?'wk|'+weekOf(S.sel)[0]:S.page+'|'+(S.page==='tl'?S.sel:S.page==='cal'?S.calMonth:'');
  const dp=$('#dayp');dp.hidden=!wk;dp.innerHTML=wk?dayPanelHtml():'';
  // 入力中のフォーカスを保つ
  const ae=document.activeElement;let keepFocus=null;
  if(ae&&ae.id&&m.contains(ae))keepFocus={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  const keep=key===lastView?m.scrollTop:null;
  m.innerHTML=wk?weekHtml():({tl:tlHtml,todo:todoHtml,habit:habitHtml,cal:calHtml,set:setHtml})[S.page]();
  S.anim='';
  if(keep!=null)m.scrollTop=keep;
  else if(wk){const w=m.querySelector('.wk');if(w)m.scrollTop=w.offsetTop+Math.max(0,S.settings.wake*60-20)*PXW}
  else if(S.page==='tl'){const tl=m.querySelector('.tl');if(tl){const t=S.sel===today()?nowMin()-90:S.settings.wake*60-20;m.scrollTop=tl.offsetTop+Math.max(0,t)*PX}}
  else m.scrollTop=0;
  lastView=key;
  if(keepFocus){const el=document.getElementById(keepFocus.id);if(el){el.value=keepFocus.v;el.focus();try{el.setSelectionRange(keepFocus.s,keepFocus.e)}catch(e){}}}
}

function tlHtml(){
  const date=S.sel,td=today(),nm=nowMin();
  const bl=blocksFor(date);
  const fs=S.loading?[]:freeSlots(date,bl);
  const untimed=S.items.filter(i=>i.date===date&&!i.start);
  let h='';
  if(untimed.length)h+=`<div class="untimed"><span class="lbl">時間未定</span>${untimed.map(i=>`<span class="chip ${i.kind} ${i.done?'done':''}" data-act="edit-item" data-id="${i.id}" role="button" tabindex="0">${i.kind==='todo'?`<span class="ck ${i.done?'on':''}" style="width:18px;height:18px;border-color:var(--todo);${i.done?'background:var(--todo)':''}" data-act="tg-item" data-id="${i.id}" role="button" aria-label="完了にする">${ICON.check}</span>`:'<span class="dot"></span>'}<span class="ti">${esc(i.title)}</span></span>`).join('')}</div>`;
  h+=`<div class="tl ${S.anim?'anim-'+S.anim:''}" style="height:${1440*PX}px">`;
  const pastH=date<td?1440:date===td?nm:0;
  if(pastH)h+=`<div class="past" style="height:${pastH*PX}px"></div>`;
  const w=S.settings.wake*60,sl=S.settings.sleep*60;
  if(w>0)h+=`<div class="off" style="top:0;height:${w*PX}px"></div>`;
  if(sl<1440)h+=`<div class="off" style="top:${sl*PX}px;height:${(1440-sl)*PX}px"></div>`;
  for(let i=0;i<24;i++)h+=`<div class="hr" style="top:${i*60*PX}px"><span>${i}:00</span></div>`;
  for(const [s,e] of fs){
    const ht=(e-s)*PX;
    h+=`<button class="free ${ht<48?'sm':''}" data-act="add-at" data-s="${s}" data-e="${e}" style="top:${s*PX+2}px;height:${ht-4}px"><b>${fmtDur(e-s)}の空き</b><span class="num">${fromMin(s)}〜${fromMin(e)}・タップで追加</span></button>`;
  }
  for(const b of bl){
    const top=b.s*PX,ht=Math.max((b.e-b.s)*PX,24);
    const left=`calc(60px + (100% - 72px) * ${b.col}/${b.ncol})`,width=`calc((100% - 72px) / ${b.ncol} - 4px)`;
    const past=date<td||(date===td&&b.e<=nm);
    const ck=b.type==='event'?'':`<span class="ck ${b.done?'on':''}" data-act="${b.type==='habit'?'tg-habit':'tg-item'}" data-id="${b.ref.id}" data-date="${date}" role="button" aria-label="完了にする">${ICON.check}</span>`;
    h+=`<div class="blk ${b.type} ${past?'past-b':''} ${b.done?'done':''} ${ht<44?'sm':''}" data-act="${b.type==='habit'?'edit-habit':'edit-item'}" data-id="${b.ref.id}" role="button" tabindex="0" style="top:${top}px;height:${ht-2}px;left:${left};width:${width}">${ck}<div class="bt"><div class="ti">${esc(b.title)}</div><div class="tm">${fromMin(b.s)}–${fromMin(b.e)}</div></div></div>`;
  }
  if(date===td)h+=`<div class="nowline" style="top:${nm*PX}px"><span>${fromMin2(nm)}</span></div>`;
  h+='</div>';
  if(S.loading)h=`<div class="loading">読み込み中…</div>`+h;
  return h;
}

function todoRow(t){
  const meta=[t.date?md(t.date):'',t.start?`${t.start}${t.end?'–'+t.end:''}`:''].filter(Boolean).join(' ');
  return `<div class="row ${t.done?'done':''}" data-act="edit-item" data-id="${t.id}" role="button" tabindex="0">
    <span class="ck ${t.done?'on':''}" data-act="tg-item" data-id="${t.id}" role="button" aria-label="完了にする">${ICON.check}</span>
    <div class="rt"><div class="ti">${esc(t.title)}</div>${meta?`<div class="meta num">${meta}</div>`:''}</div>
    ${!t.done&&!t.start&&(!t.date||t.date>=today())?`<button class="slot-btn" data-act="fit" data-id="${t.id}">空きに入れる</button>`:''}
  </div>`;
}
function todoHtml(){
  const td=today();
  const todos=S.items.filter(i=>i.kind==='todo');
  const open=todos.filter(t=>!t.done);
  const by=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||'99').localeCompare(b.start||'99')||(a.created||0)-(b.created||0);
  const groups=[['期限切れ',open.filter(t=>t.date&&t.date<td)],['今日',open.filter(t=>t.date===td)],['これから',open.filter(t=>t.date>td)],['日付なし',open.filter(t=>!t.date)]];
  let h=`<div class="pad"><form class="qa" data-form="qa"><input id="qa-in" placeholder="ToDoを入力して追加" autocomplete="off" enterkeyhint="done" aria-label="ToDoを入力"><button type="submit">追加</button></form>`;
  if(S.loading)h+=`<div class="loading">読み込み中…</div>`;
  else if(!open.length)h+=`<div class="empty"><b>未完了のToDoはありません</b>上の欄に入力して追加できます。「空きに入れる」を押すと、今日の空き時間に30分ぶん入れてタイムラインに並べます。</div>`;
  for(const[n,list]of groups){if(!list.length)continue;list.sort(by);h+=`<section class="grp"><h3 class="gh ${n==='期限切れ'?'warn':''}">${n}<span>${list.length}</span></h3>${list.map(todoRow).join('')}</section>`}
  const done=todos.filter(t=>t.done);
  if(done.length){
    h+=`<button class="linkbtn" data-act="show-done">完了したもの（${done.length}件）を${S.showDone?'隠す':'表示'}</button>`;
    if(S.showDone)h+=`<section class="grp">${done.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,50).map(todoRow).join('')}</section>`;
  }
  return h+'</div>';
}

function habitHtml(){
  const td=today(),days=weekOf(td);
  const tdH=S.habits.filter(h=>scheduled(h,td));
  let h=`<div class="pad">`;
  if(S.loading)return h+`<div class="loading">読み込み中…</div></div>`;
  if(!S.habits.length)return h+`<div class="empty"><b>習慣はまだありません</b>右上の＋から「朝のストレッチ」「日記」などを追加すると、曜日ごとのチェックと連続日数が記録されます。時刻を決めた習慣はタイムラインにも並びます。</div></div>`;
  h+=`<div class="hsum"><b>${tdH.filter(x=>(x.log||{})[td]).length}/${tdH.length}</b><span>今日の習慣</span></div>`;
  const sorted=[...S.habits].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')||(a.title||'').localeCompare(b.title||''));
  for(const x of sorted){
    const log=x.log||{};
    h+=`<div class="hcard"><div class="hc-top" data-act="edit-habit" data-id="${x.id}" role="button" tabindex="0"><div><div class="ti">${esc(x.title)}</div><div class="meta">${daysLabel(x.days)}${x.time?` ・ <span class="num">${x.time}</span>`:''}</div></div><div class="streak"><b>${streak(x)}</b>日連続</div></div>
    <div class="hweek">${days.map(d=>{const dd=parseYmd(d).getDay(),on=scheduled(x,d),fut=d>td,dn=!!log[d];
      return `<button class="hd ${dn?'on':''} ${d===td?'today':''} ${on?'':'off'}" ${(!on||fut)?'disabled':''} data-act="tg-habit" data-id="${x.id}" data-date="${d}" aria-label="${md(d)} ${dn?'完了':'未完了'}"><span>${WD[dd]}</span><i>${on?ICON.check:'－'}</i></button>`}).join('')}</div></div>`;
  }
  return h+'</div>';
}

function calHtml(){
  if(!S.calMonth)S.calMonth=S.sel.slice(0,8)+'01';
  const m=parseYmd(S.calMonth),y=m.getFullYear(),mo=m.getMonth(),td=today();
  const ws=S.settings.weekStart,off=(m.getDay()-ws+7)%7;
  const dim=new Date(y,mo+1,0).getDate(),rows=Math.ceil((off+dim)/7);
  let g='';
  for(let i=0;i<7;i++){const wd=(ws+i)%7;g+=`<div class="wh ${wd===0?'sun':wd===6?'sat':''}">${WD[wd]}</div>`}
  for(let i=0;i<rows*7;i++){
    const d=ymd(new Date(y,mo,1-off+i)),inM=parseYmd(d).getMonth()===mo;
    const ev=S.items.some(x=>x.date===d&&x.kind==='event'),tdo=S.items.some(x=>x.date===d&&x.kind==='todo'&&!x.done);
    g+=`<button class="cd ${inM?'':'out'} ${d===td?'td':''} ${d===S.sel?'sel':''}" data-act="cal-pick" data-date="${d}" aria-label="${md(d)}"><b>${parseYmd(d).getDate()}</b><span class="dots">${ev?'<i class="e"></i>':''}${tdo?'<i class="t"></i>':''}</span></button>`;
  }
  // 選んだ日の一覧
  const list=[...blocksFor(S.sel).map(b=>({tm:fromMin(b.s),type:b.type,title:b.title,id:b.ref.id,done:b.done})),
    ...S.items.filter(i=>i.date===S.sel&&!i.start).map(i=>({tm:'－',type:i.kind,title:i.title,id:i.id,done:i.done}))];
  return `<div class="pad">
    <div class="calh"><b>${y}年${mo+1}月</b><div class="nav"><button class="iconbtn" data-act="mon" data-d="-1" aria-label="前の月">${ICON.left}</button><button class="ghost" data-act="mon" data-d="0">今月</button><button class="iconbtn" data-act="mon" data-d="1" aria-label="次の月">${ICON.right}</button></div></div>
    <div class="cal">${g}</div>
    <div class="legend"><span><i style="background:var(--ev)"></i>予定</span><span><i style="background:var(--todo)"></i>未完了のToDo</span></div>
    <section class="grp"><h3 class="gh">${md(S.sel)}</h3>
      <div class="agenda">${list.length?list.map(a=>`<div class="ag" data-act="${a.type==='habit'?'edit-habit':'edit-item'}" data-id="${a.id}" role="button" tabindex="0"><span class="tm">${a.tm}</span><span class="bar ${a.type}"></span><span class="ti" style="${a.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(a.title)}</span></div>`).join(''):'<div class="meta">この日の予定はありません。</div>'}</div>
      <button class="btn" style="align-self:flex-start;margin-top:4px" data-act="open-day" data-date="${S.sel}">タイムラインで見る</button>
    </section>
  </div>`;
}

function setHtml(){
  const opt=(from,to,v,f)=>{let s='';for(let i=from;i<=to;i++)s+=`<option value="${i}" ${i===v?'selected':''}>${f(i)}</option>`;return s};
  const nI=S.items.length,nH=S.habits.length;
  return `<div class="pad">
    <div class="set">
      <div class="sr"><div class="k">活動時間<small>この範囲で空き時間を計算します</small></div><div class="two"><select id="s-wake" aria-label="開始">${opt(3,12,S.settings.wake,i=>i+':00')}</select><span>〜</span><select id="s-sleep" aria-label="終了">${opt(16,24,S.settings.sleep,i=>i+':00')}</select></div></div>
      <div class="sr"><div class="k">週の始まり</div><select id="s-ws" aria-label="週の始まり"><option value="1" ${S.settings.weekStart===1?'selected':''}>月曜日</option><option value="0" ${S.settings.weekStart===0?'selected':''}>日曜日</option></select></div>
    </div>
    <div class="set">
      <div class="sr"><div class="k">保存先<small>このスマホの中だけに保存しています。ほかの人には見えません。</small></div></div>
      <div class="sr"><div class="k">登録数</div><span class="meta num">予定・ToDo ${nI}件 / 習慣 ${nH}件</span></div>
    </div>
    <div class="set">
      <div class="sr"><div class="k">バックアップを保存<small>機種変更の前や、ときどき保存しておくと安心です</small></div><button class="ghost" data-act="export">保存</button></div>
      <div class="sr"><div class="k">バックアップから戻す<small>今のデータは置き換わります</small></div><label class="ghost" for="imp-file" style="cursor:pointer">ファイルを選ぶ</label><input id="imp-file" type="file" accept=".json,application/json" hidden></div>
      ${S.importData?`<div class="sr" style="flex-wrap:wrap"><div class="k">このバックアップで置き換えますか？<small>予定・ToDo ${S.importData.items.length}件 / 習慣 ${S.importData.habits.length}件</small></div><div class="two"><button class="ghost" data-act="imp-cancel">やめる</button><button class="btn" data-act="imp-ok">置き換える</button></div></div>`:''}
    </div>
    <div class="meta" style="line-height:1.8">使い方：タイムラインを左右にスワイプすると日付が変わります。日付の下のつまみを下にスワイプ（またはタップ）すると1週間が表示されます。点線の「空き」をタップすると、その時間で予定を追加できます。</div>
  </div>`;
}

/* ---------- 入力シート ---------- */
let ed=null;
function openEditor(kind,obj,preset){
  ed={kind,obj:obj||null,draft:{},confirmDel:false};
  const o=obj||{};const p=preset||{};
  ed.draft={title:o.title||'',date:o.date??p.date??(kind==='event'?S.sel:''),start:o.start||p.start||'',end:o.end||p.end||'',memo:o.memo||'',
    time:o.time||'',dur:o.dur||15,days:o.days?[...o.days]:[0,1,2,3,4,5,6]};
  drawEditor();
  setTimeout(()=>{const t=$('#f-title');if(t&&!obj)t.focus()},60);
}
function readForm(){
  if(!ed)return;const v=id=>{const e=document.getElementById(id);return e?e.value:undefined};
  for(const k of['title','date','start','end','memo','time','dur']){const x=v('f-'+k);if(x!==undefined)ed.draft[k]=x}
}
function drawEditor(){
  const d=ed.draft,k=ed.kind,editing=!!ed.obj;
  const heads={event:'予定',todo:'ToDo',habit:'習慣'};
  let f=`<label class="field">タイトル<input id="f-title" value="${esc(d.title)}" placeholder="${k==='habit'?'例：朝のストレッチ':k==='todo'?'例：見積書を送る':'例：打ち合わせ'}" autocomplete="off"></label>`;
  if(k==='habit'){
    f+=`<div class="frow"><label class="field">時刻（なしでもOK）<input id="f-time" type="time" value="${esc(d.time)}"></label>
      <label class="field">所要時間<select id="f-dur">${[5,10,15,20,30,45,60,90,120].map(m=>`<option value="${m}" ${+d.dur===m?'selected':''}>${fmtDur(m)}</option>`).join('')}</select></label></div>
      <div class="field">曜日<div class="wds">${[1,2,3,4,5,6,0].map(x=>`<button type="button" class="${d.days.includes(x)?'on':''}" data-act="wd" data-w="${x}" aria-pressed="${d.days.includes(x)}">${WD[x]}</button>`).join('')}</div></div>`;
  }else{
    f+=`<label class="field">日付${k==='todo'?'（なしでもOK）':''}<input id="f-date" type="date" value="${esc(d.date)}"></label>
      <div class="frow"><label class="field">開始${k==='todo'?'（任意）':''}<input id="f-start" type="time" value="${esc(d.start)}"></label><label class="field">終了<input id="f-end" type="time" value="${esc(d.end)}"></label></div>`;
  }
  f+=`<label class="field">メモ<textarea id="f-memo">${esc(d.memo)}</textarea></label>`;
  $('#sheet-root').innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${heads[k]}の${editing?'編集':'追加'}">
    <div class="sh-h"><b>${heads[k]}を${editing?'編集':'追加'}</b><button data-act="close">閉じる</button></div>
    <div class="seg">${['event','todo','habit'].map(x=>`<button type="button" data-act="kind" data-k="${x}" class="${x===k?'on':''}" ${editing&&x!==k?'disabled':''}>${heads[x]}</button>`).join('')}</div>
    ${f}
    <div class="err" id="f-err"></div>
    <div class="sh-f">${editing?`<button class="del ${ed.confirmDel?'arm':''}" data-act="del">${ed.confirmDel?'もう一度押すと削除':'削除'}</button>`:'<span></span>'}<button class="btn" data-act="save">保存</button></div>
  </div></div>`;
}
function closeEditor(){ed=null;$('#sheet-root').innerHTML=''}
function saveEditor(){
  readForm();const d=ed.draft,err=m=>{$('#f-err').textContent=m};
  const title=(d.title||'').trim();
  if(!title)return err('タイトルを入れてください');
  if(ed.kind==='habit'){
    if(!d.days.length)return err('曜日を1つ以上選んでください');
    const h={...(ed.obj||{id:newId(),log:{},created:today()}),title,time:d.time||'',dur:+d.dur||15,days:[...d.days],memo:d.memo||''};
    saveHabit(h);
  }else{
    if(ed.kind==='event'&&!d.date)return err('日付を入れてください');
    if(d.start&&d.end&&toMin(d.end)<=toMin(d.start))return err('終了は開始より後の時刻にしてください');
    if(!d.date&&d.start)return err('時刻を入れるときは日付も入れてください');
    const it={...(ed.obj||{id:newId(),done:false,created:Date.now()}),kind:ed.kind,title,date:d.date||'',start:d.start||'',end:d.start?(d.end||''):'',memo:d.memo||''};
    saveItem(it);
  }
  closeEditor();toast('保存しました');
}

/* ---------- 操作 ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function shiftDay(n){S.sel=addDays(S.sel,n);S.anim=n>0?'l':'r';render()}
function shiftMonth(n){const m=parseYmd(S.calMonth);S.calMonth=ymd(new Date(m.getFullYear(),m.getMonth()+n,1));render()}
function nextHourPreset(date){const t=date===today()?Math.min(Math.ceil((nowMin()+1)/60)*60,23*60):Math.max(S.settings.wake,9)*60;return{date,start:fromMin2(t),end:fromMin2(Math.min(t+60,1439))}}

const ACT={
  go:t=>{S.page=t.dataset.p;if(S.page==='cal')S.calMonth=S.sel.slice(0,8)+'01';closeEditor();render()},
  'open-cal':()=>{S.page='cal';S.calMonth=S.sel.slice(0,8)+'01';render()},
  today:()=>{const n=S.sel<today()?1:-1;S.sel=today();S.anim=n>0?'l':'r';render()},
  'toggle-week':()=>{S.showWeek=!S.showWeek;render()},
  pick:t=>{const n=t.dataset.date>S.sel?1:-1;if(t.dataset.date===S.sel)return;S.sel=t.dataset.date;S.anim=n>0?'l':'r';render()},
  add:()=>{
    if(S.page==='todo')openEditor('todo');
    else if(S.page==='habit')openEditor('habit');
    else openEditor('event',null,nextHourPreset(S.sel));
  },
  'add-at':t=>{const s=+t.dataset.s,e=+t.dataset.e;openEditor('event',null,{date:S.sel,start:fromMin2(s),end:fromMin2(Math.min(e,s+60,1439))})},
  'edit-item':t=>{const it=S.items.find(x=>x.id===t.dataset.id);if(it)openEditor(it.kind,it)},
  'edit-habit':t=>{const h=S.habits.find(x=>x.id===t.dataset.id);if(h)openEditor('habit',h)},
  'tg-item':t=>{const it=S.items.find(x=>x.id===t.dataset.id);if(!it)return;saveItem({...it,done:!it.done});if(!it.done)toast('完了にしました')},
  'tg-habit':t=>{const h=S.habits.find(x=>x.id===t.dataset.id);if(!h)return;const d=t.dataset.date;const log={...(h.log||{})};if(log[d])delete log[d];else log[d]=true;saveHabit({...h,log})},
  fit:t=>{
    const it=S.items.find(x=>x.id===t.dataset.id);if(!it)return;
    const date=it.date&&it.date>today()?it.date:today();
    const slot=freeSlots(date,blocksFor(date))[0];
    if(!slot)return toast(`${date===today()?'今日':md(date)}は30分以上の空きがありません`);
    const s=slot[0];saveItem({...it,date,start:fromMin2(s),end:fromMin2(s+30)});
    toast(`${date===today()?'今日':md(date)}の ${fromMin(s)}〜${fromMin(s+30)} に入れました`);
  },
  'show-done':()=>{S.showDone=!S.showDone;render()},
  'cal-pick':t=>{const d=t.dataset.date;if(d===S.sel){S.page='tl';render();return}S.sel=d;const m=d.slice(0,8)+'01';if(m!==S.calMonth)S.calMonth=m;render()},
  'open-day':t=>{S.sel=t.dataset.date;S.page='tl';S.showWeek=false;render()},
  mon:t=>{const n=+t.dataset.d;if(n===0){S.calMonth=today().slice(0,8)+'01';S.sel=today();render()}else shiftMonth(n)},
  export:async()=>{
    const json=JSON.stringify({app:'jikancho',version:1,exportedAt:new Date().toISOString(),items:S.items,habits:S.habits,settings:S.settings},null,1);
    const name=`jikancho-backup-${today()}.json`;
    try{
      const file=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'じかん帳のバックアップ'});return}
    }catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('バックアップを保存しました');
  },
  'imp-cancel':()=>{S.importData=null;render()},
  'imp-ok':()=>{const d=S.importData;S.items=d.items;S.habits=d.habits;Object.assign(S.settings,d.settings||{});S.importData=null;Store.saveLocal();render();toast('バックアップから戻しました')},
  close:()=>closeEditor(),
  scrim:(t,e)=>{if(e.target===t)closeEditor()},
  kind:t=>{readForm();ed.kind=t.dataset.k;if(ed.kind==='event'&&!ed.draft.date)ed.draft.date=S.sel;drawEditor()},
  wd:t=>{const w=+t.dataset.w,ds=ed.draft.days,i=ds.indexOf(w);if(i<0)ds.push(w);else ds.splice(i,1);t.classList.toggle('on',i<0);t.setAttribute('aria-pressed',String(i<0))},
  save:()=>saveEditor(),
  del:()=>{
    if(!ed.confirmDel){readForm();ed.confirmDel=true;drawEditor();return}
    const id=ed.obj.id,k=ed.kind;closeEditor();
    if(k==='habit')removeHabit(id);else removeItem(id);
    toast('削除しました');
  }
};

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){f(t,e)}});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();return}
  if(e.key==='Escape'&&ed){closeEditor();return}
  if(ed||e.target.matches('input,textarea,select'))return;
  if(S.page==='tl'&&e.key==='ArrowLeft')shiftDay(-1);
  if(S.page==='tl'&&e.key==='ArrowRight')shiftDay(1);
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.dataset.form==='qa'){const inp=$('#qa-in');const v=inp.value.trim();if(!v)return;inp.value='';saveItem({id:newId(),kind:'todo',title:v,date:'',start:'',end:'',memo:'',done:false,created:Date.now()});toast('追加しました')}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='imp-file'){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    f.text().then(t=>{const d=JSON.parse(t);if(d.app!=='jikancho'||!Array.isArray(d.items)||!Array.isArray(d.habits))throw 0;S.importData=d;render()})
      .catch(()=>toast('じかん帳のバックアップファイルではないようです'));
    e.target.value='';return;
  }
  if(id==='s-wake'||id==='s-sleep'||id==='s-ws'){
    const w=+$('#s-wake').value,s=+$('#s-sleep').value;
    if(s<=w){toast('終了は開始より後にしてください');render();return}
    S.settings={...S.settings,wake:w,sleep:s,weekStart:+$('#s-ws').value};
    Store.putSettings();render();toast('設定を保存しました');
  }
});

/* スワイプ：タイムライン左右＝日付、カレンダー左右＝月、ヘッダー上下＝週表示 */
const main=$('#main'),hdr=$('#hdr');let sw=null,hs=null;
main.addEventListener('touchstart',e=>{const t=e.touches[0];sw={x:t.clientX,y:t.clientY}},{passive:true});
main.addEventListener('touchend',e=>{
  if(!sw)return;const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){if(S.page==='tl')shiftDay((dx<0?1:-1)*(S.showWeek?7:1));else if(S.page==='cal')shiftMonth(dx<0?1:-1)}
},{passive:true});
hdr.addEventListener('touchstart',e=>{const t=e.touches[0];hs={x:t.clientX,y:t.clientY}},{passive:true});
hdr.addEventListener('touchend',e=>{
  if(!hs||S.page!=='tl')return;const t=e.changedTouches[0],dx=t.clientX-hs.x,dy=t.clientY-hs.y;hs=null;
  if(Math.abs(dy)>30&&Math.abs(dy)>Math.abs(dx)){const want=dy>0;if(want!==S.showWeek){S.showWeek=want;render()}}
  else if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6&&e.target.closest('.week-strip'))shiftDay(dx<0?7:-7);
},{passive:true});

/* 現在時刻の線を1分ごとに進める */
setInterval(()=>{if(S.page==='tl'&&!ed)render()},60000);

init();
})();
</script>
</body>
</html>
